<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Música</title>
    <link rel="stylesheet" href="editar.css">
</head>
<body>
    <main class="container">
        <a href="index.html" class="link-voltar">Voltar para a lista</a>
        
        <h1>Editar música</h1>

        <label for="titulo">Título</label>
        <input type="text" id="titulo" value="Evidências">

        <label for="artista">Artista</label>
        <input type="text" id="artista" value="Chitãozinho e Xororó">

        <label for="genero">Gênero</label>
        <input type="text" id="genero" value="Sertanejo">

        <label for="ano">Ano</label>
        <input type="number" id="ano" value="1990">

        <label for="duracao">Duração em minutos</label>
        <input type="number" id="duracao" value="5">

        <button id="botaoSalvar">Salvar alterações</button>
    </main>

    <script src="editar.js"></script>
</body>
</html>
